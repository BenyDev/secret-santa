spring:
  application:
    name: secret-santa
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: secret_santa

secretsanta:
  jwt:
    private-key: ${JWT_PRIVATE_KEY_LOCATION:file:./.secrets/jwt-private.pem}
    public-key: ${JWT_PUBLIC_KEY_LOCATION:file:./.secrets/jwt-public.pem}
